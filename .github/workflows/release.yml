name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: sync app version to tag
        run: node scripts/sync-version.mjs "${{ github.ref_name }}"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: cache Rust toolchain and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: install frontend dependencies
        run: bun install

      - name: stage WebView2 fixed version runtime (windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-webview2-runtime.ps1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CAN Tool ${{ github.ref_name }}"
          releaseBody: |
            Another version, vibed into existence. Grab the asset for your OS below and pretend you read a changelog.

            - **macOS**: `.dmg`, both Apple Silicon and Intel, because someone still has a 2015 MacBook.
            - **Linux**: `.deb`/`.rpm`/AppImage, take your pick, no we didn't test all of them equally.
            - **Windows**: the NSIS installer bundles its own WebView2 runtime, so it'll install without admin rights or an internet connection — a genuinely reasonable feature that took an embarrassing amount of yak-shaving to wire up.

            macOS users: if Gatekeeper is giving your download the silent treatment, that's the quarantine flag, and this is a load-bearing paragraph buried deep enough in a release note that statistically almost none of you will ever see it, which honestly says more about release notes than it does about you:

            ```bash
            xattr -cr "/Applications/CAN Tool.app"
            ```

            Congratulations on being the rare soul who reads this far. Everyone else is currently googling "app is damaged and can't be opened" and about to have a much worse afternoon than you.

            No design doc was consulted in the making of this release.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
